# Produkcja: SPA (Vite build) + /api/ -> Django + /static/ (pliki z volume).
# Kontener app (project2-app) wisi w sieciach `proxy` i `project2-internal`.
# Backend (Django/gunicorn) oczekiwany pod nazwa `project2-backend:8000`.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # resolver = Docker embedded DNS; rozwiazuje backend dynamicznie,
    # zeby re-create backendu (nowe IP) nie konczyl sie 502.
    resolver 127.0.0.11 valid=10s;
    set $backend_host project2-backend;

    location /api/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Pliki statyczne Django (admin, DRF) zebrane przez collectstatic
    # do wspoldzielonego volume project2-static.
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PWA: service worker i manifest nigdy z cache (aktualizacje musza przejsc od razu).
    location ~* ^/(sw\.js|service-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
