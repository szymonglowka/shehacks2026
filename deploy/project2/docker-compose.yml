# Otula PROD — https://otula.hackyeah.site
# Kontrakt: /opt/infrastructure/DEPLOYMENT.md
# NPM forward: http://project2-app:80 (ten kontener obsluguje HTTP: SPA + /api/).
# Zrodla: ./src/{backend,frontend} (kopia repo, Dockerfile.prod).
# Rollback: wroc poprzednie src + `docker compose up -d --build`.
services:
  db:
    image: postgres:16
    container_name: project2-db
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - project2-pgdata:/var/lib/postgresql/data
    networks:
      - project2-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: project2-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - project2-redisdata:/data
    networks:
      - project2-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    container_name: project2-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@project2-db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://project2-redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    expose:
      - "8000"
    volumes:
      - project2-static:/code/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project2-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    container_name: project2-worker
    restart: unless-stopped
    entrypoint: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@project2-db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://project2-redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - project2-internal

  beat:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    container_name: project2-beat
    restart: unless-stopped
    entrypoint: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@project2-db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://project2-redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - project2-internal

  app:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
    container_name: project2-app
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - project2-static:/usr/share/nginx/static:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - proxy
      - project2-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
    name: proxy
  project2-internal:

volumes:
  project2-pgdata:
  project2-redisdata:
  project2-static:
