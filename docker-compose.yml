services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-otula}
      POSTGRES_USER: ${POSTGRES_USER:-otula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otula}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-otula}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # NOTE: no host port mapping on purpose (host 5432 is taken by another
    # project; every agent stack runs its own compose project).

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # NOTE: no host port mapping (see db above).

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://otula:otula@db:5432/otula}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://otula:otula@db:5432/otula}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://otula:otula@db:5432/otula}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    # Tolerates frontend/ not existing yet (platform checkpoint-0 lands before
    # f-core). Only starts with `--profile frontend`.
    command: sh -c "if [ -f package.json ]; then npm ci && npm run dev -- --host --port 5173; else echo 'no frontend yet - placeholder'; sleep infinity; fi"
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    profiles:
      - frontend

volumes:
  pgdata:
  redisdata:
